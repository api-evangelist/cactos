aid: cactos
name: Cactos
description: >-
  Cactos is a Finnish clean-energy company that designs, manufactures, and operates smart battery
  energy storage systems (BESS) for commercial, industrial, and grid-scale use. Its hardware line
  (Cactos Mylo commercial storage and Cactos Cardo backup power, built in part from second-life
  Tesla EV batteries) is paired with Cactos Spine, a cloud software platform that optimizes each
  unit for load shifting, peak shaving, demand-charge reduction, solar self-consumption, backup
  power during outages, and participation in electricity and grid-balancing markets. Cactos serves
  logistics, manufacturing, EV charging, agriculture, real estate, and commercial-property
  operators. It is a portfolio company of Union Square Ventures. As of this profile, Cactos
  publishes no public developer API, SDK, or API documentation; the Cactos Spine app at
  app.cactos.com is a customer-facing management console rather than a documented developer API.
